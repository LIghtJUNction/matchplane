name: matchplane

x-matchplane-service: &matchplane-service
  image: matchplane/services:dev
  build:
    context: ../..
    dockerfile: deploy/compose/service.Dockerfile
  restart: unless-stopped
  environment:
    MATCHPLANE_ENVIRONMENT: development
    # Compose is a local development profile. The first account may inspect the admin workspace
    # without SMTP; production packaging and the host bootstrap script keep this disabled.
    MATCHPLANE_ALLOW_DEMO_BOOTSTRAP: "${MATCHPLANE_ALLOW_DEMO_BOOTSTRAP:-true}"
    # Compatibility adapters are opt-in. Production and normal development keep the
    # domain-neutral marketplace contract as the only mounted transport; CI can explicitly
    # enable the legacy migration surface while it exercises that compatibility test suite.
    MATCHPLANE_ENABLE_LEGACY_MARKETPLACE_ADAPTER: "${MATCHPLANE_ENABLE_LEGACY_MARKETPLACE_ADAPTER:-false}"
    MATCHPLANE_NODE_ID: 00000000-0000-7000-8000-00000000000a
    MATCHPLANE_HTTP_ADDR: 0.0.0.0:8080
    MATCHPLANE_GRPC_ADDR: 0.0.0.0:50051
    MATCHPLANE_DATABASE_URL: postgres://${MATCHPLANE_POSTGRES_USER:-matchplane}:${MATCHPLANE_POSTGRES_PASSWORD:-matchplane_dev_only}@postgres:5432/${MATCHPLANE_POSTGRES_DB:-matchplane}
    MATCHPLANE_KAFKA_BROKERS: kafka:19092
    MATCHPLANE_KAFKA_SECURITY_PROTOCOL: PLAINTEXT
    MATCHPLANE_KAFKA_SSL_CA_LOCATION: ""
    MATCHPLANE_KAFKA_SSL_CERTIFICATE_LOCATION: ""
    MATCHPLANE_KAFKA_SSL_KEY_LOCATION: ""
    MATCHPLANE_VALKEY_URL: redis://:${MATCHPLANE_VALKEY_PASSWORD:-matchplane_dev_only}@valkey:6379/
    MATCHPLANE_LOG_FILTER: info,matchplane=debug
    MATCHPLANE_OTLP_ENDPOINT: http://otel-collector:4317
    MATCHPLANE_REQUIRE_TLS: "false"
    MATCHPLANE_TLS_CERTIFICATE_PATH: ""
    MATCHPLANE_TLS_PRIVATE_KEY_PATH: ""
    MATCHPLANE_TLS_CLIENT_CA_PATH: ""
  depends_on:
    migration:
      condition: service_completed_successfully
    kafka-init:
      condition: service_completed_successfully
    valkey:
      condition: service_healthy
  networks:
    - matchplane
  security_opt:
    - no-new-privileges:true

services:
  postgres:
    image: matchplane/postgres:18.4-timescale2.29.1-vector0.8.6
    build:
      context: postgres
      dockerfile: Dockerfile
      args:
        ALPINE_MIRROR: ${MATCHPLANE_ALPINE_MIRROR:-https://dl-cdn.alpinelinux.org/alpine}
    restart: unless-stopped
    shm_size: 1gb
    environment:
      POSTGRES_USER: ${MATCHPLANE_POSTGRES_USER:-matchplane}
      POSTGRES_PASSWORD: ${MATCHPLANE_POSTGRES_PASSWORD:-matchplane_dev_only}
      POSTGRES_DB: ${MATCHPLANE_POSTGRES_DB:-matchplane}
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "127.0.0.1:${MATCHPLANE_POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - matchplane

  valkey:
    image: valkey/valkey:9.1.1-alpine@sha256:ee91f7a174ac4d6a6b0685b3a60e321f0a9dbbb691f9b0e285be2ba1d1be8328
    restart: unless-stopped
    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --save
      - "60"
      - "1"
      - --requirepass
      - ${MATCHPLANE_VALKEY_PASSWORD:-matchplane_dev_only}
    ports:
      - "127.0.0.1:${MATCHPLANE_VALKEY_HOST_PORT:-6379}:6379"
    volumes:
      - valkey-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "valkey-cli",
          "-a",
          "${MATCHPLANE_VALKEY_PASSWORD:-matchplane_dev_only}",
          "ping",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - matchplane

  kafka:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093,PLAINTEXT_HOST://:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 12
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
    ports:
      - "127.0.0.1:${MATCHPLANE_KAFKA_HOST_PORT:-9092}:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    networks:
      - matchplane

  kafka-init:
    image: apache/kafka:4.3.1@sha256:77e3df9054047a88b520d0cc46e16696d3b22022e1d580aeccd2632df6532837
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-euc"]
    command:
      - |
        for topic in \
          matchplane.commands.v1 \
          matchplane.domain-events.v1 \
          matchplane.order-book-deltas.v1 \
          matchplane.market-summaries.v1 \
          matchplane.node-health.v1; do
          /opt/kafka/bin/kafka-topics.sh \
            --bootstrap-server kafka:19092 \
            --create --if-not-exists \
            --topic "$${topic}" \
            --partitions 12 \
            --replication-factor 1
        done
    networks:
      - matchplane

  migration:
    <<: *matchplane-service
    restart: "no"
    entrypoint: ["/usr/local/bin/matchplane"]
    command: ["initialize"]
    depends_on:
      postgres:
        condition: service_healthy

  gateway:
    <<: *matchplane-service
    entrypoint: ["/usr/local/bin/matchplane", "serve", "gateway"]
    ports:
      - "127.0.0.1:${MATCHPLANE_GATEWAY_HOST_PORT:-8080}:8080"

  web:
    image: matchplane/web:dev
    build:
      context: ../..
      dockerfile: deploy/compose/web.Dockerfile
    restart: unless-stopped
    environment:
      MATCHPLANE_ENVIRONMENT: ${MATCHPLANE_ENVIRONMENT:-development}
      MATCHPLANE_ALLOW_DEMO_BOOTSTRAP: ${MATCHPLANE_ALLOW_DEMO_BOOTSTRAP:-true}
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 4173
      # Keep the browser origin aligned with a custom host port. Better Auth rejects sign-in
      # requests when the published port (for example 54173) is absent from its trusted origins.
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:${MATCHPLANE_WEB_HOST_PORT:-4173}}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-matchplane_dev_only_auth_secret_change_in_production}
      MATCHPLANE_OIDC_ENABLED: ${MATCHPLANE_OIDC_ENABLED:-true}
      MATCHPLANE_NATIONAL_IDENTITY_OAUTH_CLIENT_ID: ${MATCHPLANE_NATIONAL_IDENTITY_OAUTH_CLIENT_ID:-}
      MATCHPLANE_NATIONAL_IDENTITY_OAUTH_CLIENT_SECRET: ${MATCHPLANE_NATIONAL_IDENTITY_OAUTH_CLIENT_SECRET:-}
      MATCHPLANE_NATIONAL_IDENTITY_OAUTH_DISCOVERY_URL: ${MATCHPLANE_NATIONAL_IDENTITY_OAUTH_DISCOVERY_URL:-}
      MATCHPLANE_NATIONAL_IDENTITY_OAUTH_AUTHORIZATION_URL: ${MATCHPLANE_NATIONAL_IDENTITY_OAUTH_AUTHORIZATION_URL:-}
      MATCHPLANE_NATIONAL_IDENTITY_OAUTH_TOKEN_URL: ${MATCHPLANE_NATIONAL_IDENTITY_OAUTH_TOKEN_URL:-}
      MATCHPLANE_NATIONAL_IDENTITY_OAUTH_USERINFO_URL: ${MATCHPLANE_NATIONAL_IDENTITY_OAUTH_USERINFO_URL:-}
      MATCHPLANE_NATIONAL_IDENTITY_OAUTH_SCOPES: ${MATCHPLANE_NATIONAL_IDENTITY_OAUTH_SCOPES:-openid}
      MATCHPLANE_ROOT_ADMIN_EMAIL: ${MATCHPLANE_ROOT_ADMIN_EMAIL:-}
      MATCHPLANE_ROOT_SMTP_PROVIDER_KEY: ${MATCHPLANE_ROOT_SMTP_PROVIDER_KEY:-}
      MATCHPLANE_ROOT_SMTP_HOST: ${MATCHPLANE_ROOT_SMTP_HOST:-}
      MATCHPLANE_ROOT_SMTP_PORT: ${MATCHPLANE_ROOT_SMTP_PORT:-}
      MATCHPLANE_ROOT_SMTP_TLS_MODE: ${MATCHPLANE_ROOT_SMTP_TLS_MODE:-}
      MATCHPLANE_ROOT_SMTP_USERNAME: ${MATCHPLANE_ROOT_SMTP_USERNAME:-}
      MATCHPLANE_ROOT_SMTP_CREDENTIAL_SECRET_REF: ${MATCHPLANE_ROOT_SMTP_CREDENTIAL_SECRET_REF:-}
      MATCHPLANE_ROOT_SMTP_FROM_ADDRESS: ${MATCHPLANE_ROOT_SMTP_FROM_ADDRESS:-}
      MATCHPLANE_ROOT_SMTP_REPLY_TO: ${MATCHPLANE_ROOT_SMTP_REPLY_TO:-}
      MATCHPLANE_ROOT_SMTP_MODE: ${MATCHPLANE_ROOT_SMTP_MODE:-test}
      MATCHPLANE_ROOT_SMTP_ENABLED: ${MATCHPLANE_ROOT_SMTP_ENABLED:-true}
      MATCHPLANE_ROOT_SMTP_PASSWORD: ${MATCHPLANE_ROOT_SMTP_PASSWORD:-}
      MATCHPLANE_ROOT_TENANT_ID: ${MATCHPLANE_ROOT_TENANT_ID:-}
      MATCHPLANE_SUBPLATFORM_ARTIFACT_ROOT: ${MATCHPLANE_SUBPLATFORM_ARTIFACT_ROOT:-/var/lib/matchplane/subplatform-artifacts}
      MATCHPLANE_SUBPLATFORM_UPLOAD_ROOT: ${MATCHPLANE_SUBPLATFORM_UPLOAD_ROOT:-/var/lib/matchplane/subplatform-uploads}
      MATCHPLANE_SUBPLATFORM_MCP_ENDPOINTS_JSON: '${MATCHPLANE_SUBPLATFORM_MCP_ENDPOINTS_JSON:-{}}'
      MATCHPLANE_MEDIA_MAX_BYTES: ${MATCHPLANE_MEDIA_MAX_BYTES:-26214400}
      MATCHPLANE_HOSTED_MEDIA_ROOT: ${MATCHPLANE_HOSTED_MEDIA_ROOT:-/var/lib/matchplane/media}
      MATCHPLANE_SUBPLATFORM_BUILDER_TOKEN: ${MATCHPLANE_SUBPLATFORM_BUILDER_TOKEN:-}
      MATCHPLANE_SUBPLATFORM_SECRET_ROOT: ${MATCHPLANE_SUBPLATFORM_SECRET_ROOT:-/run/secrets/subplatform-email}
      MATCHPLANE_ROOT_PLATFORM_ORGANIZATION_ID: ${MATCHPLANE_ROOT_PLATFORM_ORGANIZATION_ID:-}
      MATCHPLANE_ROUTER_AI_URL: ${MATCHPLANE_ROUTER_AI_URL:-}
      MATCHPLANE_ROUTER_AI_KEY: ${MATCHPLANE_ROUTER_AI_KEY:-}
      MATCHPLANE_ROUTER_AI_MODEL: ${MATCHPLANE_ROUTER_AI_MODEL:-}
      MATCHPLANE_ROUTER_AI_PROTOCOL: ${MATCHPLANE_ROUTER_AI_PROTOCOL:-openai-compatible}
      MATCHPLANE_ROUTER_AI_MAX_TOKENS: ${MATCHPLANE_ROUTER_AI_MAX_TOKENS:-512}
      MATCHPLANE_ROUTER_AI_TOOL_MODE: ${MATCHPLANE_ROUTER_AI_TOOL_MODE:-auto}
      MATCHPLANE_ROUTER_AI_MAX_STEPS: ${MATCHPLANE_ROUTER_AI_MAX_STEPS:-8}
      MATCHPLANE_ROUTER_AI_REQUESTS_PER_HOUR: ${MATCHPLANE_ROUTER_AI_REQUESTS_PER_HOUR:-120}
      MATCHPLANE_ROUTER_AI_GLOBAL_REQUESTS_PER_HOUR: ${MATCHPLANE_ROUTER_AI_GLOBAL_REQUESTS_PER_HOUR:-120}
      MATCHPLANE_DATABASE_URL: postgres://${MATCHPLANE_POSTGRES_USER:-matchplane}:${MATCHPLANE_POSTGRES_PASSWORD:-matchplane_dev_only}@postgres:5432/${MATCHPLANE_POSTGRES_DB:-matchplane}
      MATCHPLANE_GATEWAY_INTERNAL_URL: http://gateway:8080
      # The web session bridge calls the gateway's internal capability exchange. Keep this
      # development fallback identical to the gateway's documented development default; in
      # production use MATCHPLANE_GATEWAY_ADMIN_TOKEN_FILE instead of this inline value.
      MATCHPLANE_GATEWAY_ADMIN_TOKEN: ${MATCHPLANE_GATEWAY_ADMIN_TOKEN:-matchplane-development-gateway-admin}
      MATCHPLANE_PAYMENT_INTERNAL_URL: http://payment-service:8080
      # Development-only mirror of the payment service's built-in bearer. Production must
      # provide MATCHPLANE_PAYMENT_ADMIN_TOKEN_FILE through the web workload secret instead.
      MATCHPLANE_PAYMENT_ADMIN_TOKEN: ${MATCHPLANE_PAYMENT_ADMIN_TOKEN:-matchplane-development-admin}
    depends_on:
      migration:
        condition: service_completed_successfully
      gateway:
        condition: service_started
      payment-service:
        condition: service_started
    ports:
      - "127.0.0.1:${MATCHPLANE_WEB_HOST_PORT:-4173}:4173"
    volumes:
      - ${MATCHPLANE_SUBPLATFORM_ARTIFACT_ROOT:-./var/subplatform-artifacts}:/var/lib/matchplane/subplatform-artifacts:ro
      - ${MATCHPLANE_SUBPLATFORM_UPLOAD_ROOT:-./var/subplatform-uploads}:/var/lib/matchplane/subplatform-uploads:rw
      - ${MATCHPLANE_HOSTED_MEDIA_HOST_ROOT:-./var/hosted-media}:/var/lib/matchplane/media:rw
      # Durable managed router generations and credential slots. This bind mount is intentionally
      # Web-only; prepare it with deploy/scripts/prepare-compose-router-state.sh before startup.
      - ${MATCHPLANE_PLATFORM_ROUTER_STATE_HOST_ROOT:-../../var/platform-router-state}:/etc/matchplane/secrets/root-email:rw
      - ${MATCHPLANE_SUBPLATFORM_SECRET_HOST_ROOT:-./var/subplatform-email-secrets}:/run/secrets/subplatform-email:ro
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4173/api/health/web').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - matchplane
    security_opt:
      - no-new-privileges:true

  subplatform-builder:
    image: matchplane/subplatform-builder:dev
    build:
      context: ../..
      dockerfile: deploy/compose/builder.Dockerfile
    restart: unless-stopped
    environment:
      MATCHPLANE_SUBPLATFORM_BUILDER_WEB_URL: http://web:4173
      MATCHPLANE_SUBPLATFORM_BUILDER_TOKEN: ${MATCHPLANE_SUBPLATFORM_BUILDER_TOKEN:-}
      MATCHPLANE_SUBPLATFORM_UPLOAD_ROOT: /var/lib/matchplane/subplatform-uploads
      MATCHPLANE_SUBPLATFORM_ARTIFACT_ROOT: /var/lib/matchplane/subplatform-artifacts
      MATCHPLANE_SUBPLATFORM_BUILDER_WORK_ROOT: /var/lib/matchplane/subplatform-builder-work
      MATCHPLANE_SUBPLATFORM_BUILDER_POLL_SECONDS: ${MATCHPLANE_SUBPLATFORM_BUILDER_POLL_SECONDS:-5}
      MATCHPLANE_SUBPLATFORM_BUILDER_BUILD_SECONDS: ${MATCHPLANE_SUBPLATFORM_BUILDER_BUILD_SECONDS:-900}
      MATCHPLANE_SUBPLATFORM_GIT_ALLOWED_HOSTS: ${MATCHPLANE_SUBPLATFORM_GIT_ALLOWED_HOSTS:-github.com,gitlab.com}
      MATCHPLANE_LOG_FILTER: ${MATCHPLANE_LOG_FILTER:-info}
      MATCHPLANE_OTLP_ENDPOINT: http://otel-collector:4317
    depends_on:
      web:
        condition: service_healthy
    volumes:
      - ${MATCHPLANE_SUBPLATFORM_ARTIFACT_ROOT:-./var/subplatform-artifacts}:/var/lib/matchplane/subplatform-artifacts:rw
      - ${MATCHPLANE_SUBPLATFORM_UPLOAD_ROOT:-./var/subplatform-uploads}:/var/lib/matchplane/subplatform-uploads:ro
      - subplatform-builder-work:/var/lib/matchplane/subplatform-builder-work:rw
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=256m
    pids_limit: 256
    mem_limit: 1g
    cpus: "2.0"
    networks:
      - matchplane
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  payment-service:
    <<: *matchplane-service
    entrypoint: ["/usr/local/bin/matchplane", "serve", "payment-service"]
    depends_on:
      migration:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${MATCHPLANE_PAYMENT_HOST_PORT:-8081}:8080"

  event-relay:
    <<: *matchplane-service
    entrypoint: ["/usr/local/bin/matchplane", "serve", "event-relay"]

  # Deliberately excluded from the default Compose graph. Operators must select this profile,
  # which also supplies the exact workload role and explicit enable gate.
  conversion-projector:
    <<: *matchplane-service
    profiles: ["conversion-projector"]
    entrypoint:
      - /usr/bin/env
      - MATCHPLANE_SERVICE_ROLE=conversion-projector
      - MATCHPLANE_CONVERSION_PROJECTOR_ENABLED=true
      - /usr/local/bin/matchplane
      - serve
      - conversion-projector
    ports:
      - "127.0.0.1:${MATCHPLANE_CONVERSION_PROJECTOR_HOST_PORT:-8082}:8080"

  matcher:
    <<: *matchplane-service
    entrypoint: ["/usr/local/bin/matchplane", "serve", "matcher"]

  projector:
    <<: *matchplane-service
    entrypoint: ["/usr/local/bin/matchplane", "serve", "projector"]

  vector-worker:
    <<: *matchplane-service
    entrypoint: ["/usr/local/bin/matchplane", "serve", "vector-worker"]

  federation-hub:
    <<: *matchplane-service
    entrypoint: ["/usr/local/bin/matchplane", "serve", "federation-hub"]
    ports:
      - "127.0.0.1:${MATCHPLANE_FEDERATION_HOST_PORT:-50051}:50051"

volumes:
  postgres-data:
  valkey-data:
  kafka-data:
  subplatform-builder-work:

networks:
  matchplane:
    driver: bridge
