server_tokens off;

map $http_upgrade $matchplane_connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=matchplane_api:10m rate=20r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name matx.tech;

    root /var/www/matchplane/current;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/matchplane/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name matx.tech;

    proxy_hide_header X-Powered-By;

    root /var/www/matchplane/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/matx.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/matx.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:matchplane_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Next.js App Router emits a small inline RSC/hydration bootstrap and the
    # UI motion layer renders inline style attributes.  Blocking either one
    # leaves the server-rendered page visible but prevents React from
    # hydrating, making every control appear dead.  Keep the policy narrow to
    # this same-origin application while explicitly allowing those two
    # framework requirements.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(self)" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 1m;

    # Media requests are validated and capped by the Next route using
    # MATCHPLANE_MEDIA_MAX_BYTES. Do not let the proxy's small default (1 MiB)
    # reject the 25 MiB default before the application can apply its own
    # tenant-aware policy. The application hard ceiling remains 256 MiB.
    location = /api/platform/media/upload {
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_pass http://127.0.0.1:4173;
        include proxy_params;
    }

    location = /api/health/live {
        proxy_pass http://127.0.0.1:8080/health/live;
        include proxy_params;
    }

    location = /api/health/ready {
        proxy_pass http://127.0.0.1:8080/health/ready;
        include proxy_params;
    }

    location = /api/metrics {
        return 404;
    }

    # Better Auth and root admin bridges run in the packaged Next standalone service.
    location = /api/auth {
        proxy_pass http://127.0.0.1:4173;
        include proxy_params;
    }

    location ^~ /api/auth/ {
        proxy_pass http://127.0.0.1:4173;
        include proxy_params;
    }

    # All authenticated administrator BFF routes stay on the Next/Better Auth boundary. The
    # server-side route pins tenant scope and forwards the bearer to the private payment service;
    # sending these paths to the Rust marketplace catch-all would make the controls look like 404s.
    location ^~ /api/admin/ {
        proxy_pass http://127.0.0.1:4173;
        include proxy_params;
    }

    # CLI-issued root/subplatform administrator invites are redeemed by the
    # Better Auth/Next boundary, not by the Rust marketplace gateway.
    location ^~ /api/admin-invites/ {
        proxy_pass http://127.0.0.1:4173;
        include proxy_params;
    }

    # Public account creation still terminates at the Next/Better Auth boundary.
    # These routes perform the same origin checks and never fall through to the
    # marketplace gateway, which otherwise returns a misleading 404.
    location ^~ /api/registration/ {
        proxy_pass http://127.0.0.1:4173;
        include proxy_params;
    }

    location ^~ /api/super-admin-bootstrap/ {
        proxy_pass http://127.0.0.1:4173;
        include proxy_params;
    }

    # Session bridges and platform administration are Next.js/Better Auth routes.
    # Keep them ahead of the Rust /api/ catch-all below.
    location ^~ /api/account/ {
        proxy_pass http://127.0.0.1:4173;
        include proxy_params;
    }

    location ^~ /api/mall/ {
        proxy_pass http://127.0.0.1:4173;
        include proxy_params;
    }

    location ^~ /api/marketplace/ {
        proxy_pass http://127.0.0.1:4173;
        include proxy_params;
    }

    location = /api/stores {
        proxy_pass http://127.0.0.1:4173;
        include proxy_params;
    }

    location ^~ /api/stores/ {
        proxy_pass http://127.0.0.1:4173;
        include proxy_params;
    }

    location ^~ /api/store-media/ {
        proxy_pass http://127.0.0.1:4173;
        include proxy_params;
    }

    location ^~ /api/health/web {
        proxy_pass http://127.0.0.1:4173;
        include proxy_params;
    }

    location ^~ /api/platform/ {
        proxy_pass http://127.0.0.1:4173;
        include proxy_params;
    }

    # Verified subplatform artifacts are deliberately rendered in a sandboxed
    # same-origin iframe by the web host.  The application route already
    # constrains the artifact response to frame-ancestors 'self'; override the
    # server-wide clickjacking default for this one path so the iframe can load
    # while keeping the rest of the application non-embeddable.
    location ^~ /api/platform/plugin-assets/ {
        proxy_pass http://127.0.0.1:4173;
        include proxy_params;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'none'; connect-src 'none'; font-src 'self'; form-action 'none'; frame-ancestors 'self'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(self)" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # Authenticated Agent MCP calls are handled by the Next/Better Auth boundary,
    # not by the Rust marketplace catch-all below.
    location = /api/mcp {
        proxy_pass http://127.0.0.1:4173;
        include proxy_params;
    }

    location ^~ /api/ {
        limit_req zone=matchplane_api burst=40 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Connection $matchplane_connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_pass http://127.0.0.1:8080/;
        include proxy_params;
    }

    # Direct payment-service administrator endpoints stay loopback-only; the browser uses the
    # authenticated same-origin BFF above instead.
    location ^~ /payments-api/v1/admin/ {
        return 404;
    }

    location = /payments-api/health/live {
        proxy_pass http://127.0.0.1:8081/health/live;
        include proxy_params;
    }

    location = /payments-api/health/ready {
        proxy_pass http://127.0.0.1:8081/health/ready;
        include proxy_params;
    }

    location = /payments-api/metrics {
        return 404;
    }

    location ^~ /payments-api/ {
        limit_req zone=matchplane_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8081/;
        include proxy_params;
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Connection $matchplane_connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        include proxy_params;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /matchplane-marketplace-art.png {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Connection $matchplane_connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        include proxy_params;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Connection $matchplane_connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        include proxy_params;
    }
}
