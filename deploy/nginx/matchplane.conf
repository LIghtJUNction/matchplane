map $http_upgrade $matchplane_connection_upgrade {
    default upgrade;
    ''      close;
}

limit_req_zone $binary_remote_addr zone=matchplane_api:10m rate=20r/s;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 47.107.46.151;

    root /var/www/matchplane/current;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/matchplane/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 308 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2 default_server;
    listen [::]:443 ssl http2 default_server;
    server_name 47.107.46.151;

    root /var/www/matchplane/current;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/47.107.46.151/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/47.107.46.151/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:matchplane_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; connect-src 'self'; font-src 'self'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; object-src 'none'; script-src 'self'; style-src 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(self)" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    client_max_body_size 1m;

    location = /api/health/live {
        proxy_pass http://127.0.0.1:8080/health/live;
        include proxy_params;
    }

    location = /api/health/ready {
        proxy_pass http://127.0.0.1:8080/health/ready;
        include proxy_params;
    }

    location = /api/metrics {
        return 404;
    }

    # Better Auth and root admin bridges run in the packaged Next standalone service.
    location = /api/auth {
        proxy_pass http://127.0.0.1:4173;
        include proxy_params;
    }

    location ^~ /api/auth/ {
        proxy_pass http://127.0.0.1:4173;
        include proxy_params;
    }

    location ^~ /api/admin/payment-mode {
        proxy_pass http://127.0.0.1:4173;
        include proxy_params;
    }

    location ^~ /api/ {
        limit_req zone=matchplane_api burst=40 nodelay;
        proxy_http_version 1.1;
        proxy_set_header Connection $matchplane_connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        proxy_pass http://127.0.0.1:8080/;
        include proxy_params;
    }

    # Payment administration stays loopback-only until a dedicated authenticated
    # operator surface is deployed.
    location ^~ /payments-api/v1/admin/ {
        return 404;
    }

    location = /payments-api/health/live {
        proxy_pass http://127.0.0.1:8081/health/live;
        include proxy_params;
    }

    location = /payments-api/health/ready {
        proxy_pass http://127.0.0.1:8081/health/ready;
        include proxy_params;
    }

    location = /payments-api/metrics {
        return 404;
    }

    location ^~ /payments-api/ {
        limit_req zone=matchplane_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:8081/;
        include proxy_params;
    }

    location /assets/ {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Connection $matchplane_connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        include proxy_params;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /matchplane-marketplace-art.png {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Connection $matchplane_connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        include proxy_params;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Connection $matchplane_connection_upgrade;
        proxy_set_header Upgrade $http_upgrade;
        include proxy_params;
    }
}
