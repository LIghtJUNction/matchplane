server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 47.107.46.151;

    root /var/www/matchplane/current;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/matchplane/acme;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
