{{- $root := . -}}
{{- $services := list
  (dict "name" "gateway" "binary" "matchplane-gateway" "replicas" .Values.gateway.replicas "port" 8080)
  (dict "name" "payment-service" "binary" "matchplane-payment-service" "replicas" .Values.paymentService.replicas "port" 8080)
  (dict "name" "event-relay" "binary" "matchplane-event-relay" "replicas" .Values.workers.eventRelayReplicas)
  (dict "name" "projector" "binary" "matchplane-projector" "replicas" .Values.workers.projectorReplicas)
  (dict "name" "vector-worker" "binary" "matchplane-vector-worker" "replicas" .Values.workers.vectorWorkerReplicas)
  (dict "name" "federation-hub" "binary" "matchplane-federation-hub" "replicas" .Values.federationHub.replicas "port" 50051)
-}}
{{- range $index, $service := $services }}
{{- if $index }}
---
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "matchplane.fullname" $root }}-{{ $service.name }}
  labels:
    {{- include "matchplane.labels" $root | nindent 4 }}
    app.kubernetes.io/component: {{ $service.name }}
spec:
  replicas: {{ $service.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "matchplane.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: {{ $service.name }}
  template:
    metadata:
      labels:
        {{- include "matchplane.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: {{ $service.name }}
    spec:
      serviceAccountName: {{ include "matchplane.fullname" $root }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml $root.Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: {{ $service.name }}
          image: {{ include "matchplane.image" $root }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          command: ["/usr/local/bin/matchplane", "serve", "{{ $service.name }}"]
          env:
            {{- include "matchplane.environment" (dict "root" $root "service" $service.name) | nindent 12 }}
          {{- with $service.port }}
          ports:
            - name: {{ ternary "http" "grpc" (eq . 8080) }}
              containerPort: {{ . }}
              protocol: TCP
          {{- end }}
          {{- if or (eq $service.name "gateway") (eq $service.name "payment-service") }}
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            {{- toYaml $root.Values.resources | nindent 12 }}
          {{- if or (eq $service.name "gateway") (eq $service.name "payment-service") }}
          volumeMounts:
            - name: application-secrets
              mountPath: /run/secrets
              readOnly: true
          {{- else if eq $service.name "federation-hub" }}
          volumeMounts:
            - name: federation-tls
              mountPath: /run/matchplane/tls
              readOnly: true
          {{- else if or (eq $service.name "event-relay") (eq $service.name "projector") }}
          volumeMounts:
            - name: kafka-tls
              mountPath: /run/matchplane/kafka
              readOnly: true
          {{- end }}
      {{- if or (eq $service.name "gateway") (eq $service.name "payment-service") }}
      volumes:
        - name: application-secrets
          secret:
            secretName: {{ if eq $service.name "gateway" }}{{ required "runtime.existingGatewaySecret is required" $root.Values.runtime.existingGatewaySecret }}{{ else }}{{ required "runtime.existingPaymentSecret is required" $root.Values.runtime.existingPaymentSecret }}{{ end }}
            defaultMode: 0440
      {{- else if eq $service.name "federation-hub" }}
      volumes:
        - name: federation-tls
          secret:
            secretName: {{ required "runtime.existingTlsSecret is required" $root.Values.runtime.existingTlsSecret }}
            defaultMode: 0440
      {{- else if or (eq $service.name "event-relay") (eq $service.name "projector") }}
      volumes:
        - name: kafka-tls
          secret:
            secretName: {{ include "matchplane.kafkaTlsSecret" (dict "root" $root "service" $service.name) }}
            defaultMode: 0440
      {{- end }}
      {{- with $root.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $root.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
{{- end }}
{{- end }}

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "matchplane.fullname" $root }}-web
  labels:
    {{- include "matchplane.labels" $root | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ $root.Values.web.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "matchplane.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        {{- include "matchplane.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: web
    spec:
      serviceAccountName: {{ include "matchplane.fullname" $root }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml $root.Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: {{ include "matchplane.webImage" $root }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          command: ["/usr/local/bin/matchplane", "serve", "web"]
          env:
            - name: MATCHPLANE_ENVIRONMENT
              value: {{ $root.Values.runtime.environment | quote }}
            - name: MATCHPLANE_SERVICE_ROLE
              value: web
            - name: NODE_ENV
              value: production
            - name: HOSTNAME
              value: 0.0.0.0
            - name: PORT
              value: "4173"
            - name: MATCHPLANE_WEB_NODE
              value: /usr/local/bin/node
            - name: MATCHPLANE_WEB_SERVER
              value: /app/server.js
            - name: BETTER_AUTH_URL
              value: {{ required "web.betterAuthUrl is required" $root.Values.web.betterAuthUrl | quote }}
            - name: BETTER_AUTH_TRUSTED_ORIGINS
              value: {{ $root.Values.web.trustedOrigins | quote }}
            - name: BETTER_AUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "runtime.existingWebSecret is required" $root.Values.runtime.existingWebSecret }}
                  key: better-auth-secret
            - name: MATCHPLANE_NATIONAL_IDENTITY_OAUTH_CLIENT_ID
              value: {{ $root.Values.web.nationalIdentity.clientId | quote }}
            - name: MATCHPLANE_NATIONAL_IDENTITY_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ required "runtime.existingWebSecret is required" $root.Values.runtime.existingWebSecret }}
                  key: national-identity-client-secret
                  optional: true
            - name: MATCHPLANE_NATIONAL_IDENTITY_OAUTH_DISCOVERY_URL
              value: {{ $root.Values.web.nationalIdentity.discoveryUrl | quote }}
            - name: MATCHPLANE_NATIONAL_IDENTITY_OAUTH_AUTHORIZATION_URL
              value: {{ $root.Values.web.nationalIdentity.authorizationUrl | quote }}
            - name: MATCHPLANE_NATIONAL_IDENTITY_OAUTH_TOKEN_URL
              value: {{ $root.Values.web.nationalIdentity.tokenUrl | quote }}
            - name: MATCHPLANE_NATIONAL_IDENTITY_OAUTH_USERINFO_URL
              value: {{ $root.Values.web.nationalIdentity.userInfoUrl | quote }}
            - name: MATCHPLANE_NATIONAL_IDENTITY_OAUTH_SCOPES
              value: {{ $root.Values.web.nationalIdentity.scopes | quote }}
            - name: MATCHPLANE_ROOT_ADMIN_EMAIL
              valueFrom:
                secretKeyRef:
                  name: {{ required "runtime.existingWebSecret is required" $root.Values.runtime.existingWebSecret }}
                  key: root-admin-email
            - name: MATCHPLANE_ROOT_TENANT_ID
              value: {{ $root.Values.web.rootTenantId | quote }}
            - name: MATCHPLANE_SUBPLATFORM_ARTIFACT_ROOT
              value: {{ $root.Values.web.artifactRoot | quote }}
            - name: MATCHPLANE_SUBPLATFORM_UPLOAD_ROOT
              value: {{ $root.Values.web.uploadRoot | quote }}
            - name: MATCHPLANE_MEDIA_MAX_BYTES
              value: {{ $root.Values.web.mediaMaxBytes | quote }}
            - name: MATCHPLANE_SUBPLATFORM_SECRET_ROOT
              value: {{ $root.Values.web.secretRoot | quote }}
            - name: MATCHPLANE_ROOT_PLATFORM_ORGANIZATION_ID
              value: {{ $root.Values.web.rootOrganizationId | quote }}
            - name: MATCHPLANE_ROOT_SMTP_PROVIDER_KEY
              value: {{ $root.Values.web.rootSmtp.providerKey | quote }}
            - name: MATCHPLANE_ROOT_SMTP_HOST
              value: {{ $root.Values.web.rootSmtp.host | quote }}
            - name: MATCHPLANE_ROOT_SMTP_PORT
              value: {{ $root.Values.web.rootSmtp.port | quote }}
            - name: MATCHPLANE_ROOT_SMTP_TLS_MODE
              value: {{ $root.Values.web.rootSmtp.tlsMode | quote }}
            - name: MATCHPLANE_ROOT_SMTP_USERNAME
              value: {{ $root.Values.web.rootSmtp.username | quote }}
            - name: MATCHPLANE_ROOT_SMTP_CREDENTIAL_SECRET_REF
              valueFrom:
                secretKeyRef:
                  name: {{ required "runtime.existingWebSecret is required" $root.Values.runtime.existingWebSecret }}
                  key: root-smtp-credential-ref
                  optional: true
            - name: MATCHPLANE_ROOT_SMTP_FROM_ADDRESS
              value: {{ $root.Values.web.rootSmtp.fromAddress | quote }}
            - name: MATCHPLANE_ROOT_SMTP_REPLY_TO
              value: {{ $root.Values.web.rootSmtp.replyTo | quote }}
            - name: MATCHPLANE_ROOT_SMTP_MODE
              value: {{ $root.Values.web.rootSmtp.mode | quote }}
            - name: MATCHPLANE_ROOT_SMTP_ENABLED
              value: {{ $root.Values.web.rootSmtp.enabled | quote }}
            - name: MATCHPLANE_ROUTER_AI_URL
              value: {{ $root.Values.web.routerAiUrl | quote }}
            - name: MATCHPLANE_ROUTER_AI_MODEL
              value: {{ $root.Values.web.routerAiModel | quote }}
            - name: MATCHPLANE_ROUTER_AI_PROTOCOL
              value: {{ $root.Values.web.routerAiProtocol | quote }}
            - name: MATCHPLANE_ROUTER_AI_MAX_TOKENS
              value: {{ $root.Values.web.routerAiMaxTokens | quote }}
            - name: MATCHPLANE_ROUTER_AI_TOOL_MODE
              value: {{ $root.Values.web.routerAiToolMode | quote }}
            - name: MATCHPLANE_ROUTER_AI_MAX_STEPS
              value: {{ $root.Values.web.routerAiMaxSteps | quote }}
            - name: MATCHPLANE_ROUTER_AI_REQUESTS_PER_HOUR
              value: {{ $root.Values.web.routerAiRequestsPerHour | quote }}
            - name: MATCHPLANE_ROUTER_AI_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "runtime.existingWebSecret is required" $root.Values.runtime.existingWebSecret }}
                  key: router-ai-key
                  optional: true
            - name: MATCHPLANE_SUBPLATFORM_BUILDER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ required "runtime.existingWebSecret is required" $root.Values.runtime.existingWebSecret }}
                  key: subplatform-builder-token
                  optional: true
            - name: MATCHPLANE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "matchplane.runtimeSecret" (dict "root" $root "service" "web") }}
                  key: database-url
            - name: MATCHPLANE_GATEWAY_INTERNAL_URL
              value: {{ printf "http://%s-gateway:%v" (include "matchplane.fullname" $root) $root.Values.gateway.service.port | quote }}
            - name: MATCHPLANE_PAYMENT_INTERNAL_URL
              value: {{ printf "http://%s-payment-service:%v" (include "matchplane.fullname" $root) $root.Values.paymentService.service.port | quote }}
            - name: MATCHPLANE_PAYMENT_ADMIN_TOKEN_FILE
              value: /run/matchplane/admin-secrets/payment-admin.token
            - name: MATCHPLANE_GATEWAY_ADMIN_TOKEN_FILE
              value: /run/matchplane/admin-secrets/gateway-admin.token
          ports:
            - name: http
              containerPort: 4173
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /api/health/web
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: admin-bearer-secrets
              mountPath: /run/matchplane/admin-secrets
              readOnly: true
          {{- if $root.Values.web.artifactPvc }}
            - name: subplatform-artifacts
              mountPath: {{ $root.Values.web.artifactRoot | quote }}
              readOnly: true
          {{- end }}
          {{- if $root.Values.web.uploadPvc }}
            - name: subplatform-uploads
              mountPath: {{ $root.Values.web.uploadRoot | quote }}
              readOnly: false
          {{- end }}
          {{- if $root.Values.web.secretPvc }}
            - name: subplatform-email-secrets
              mountPath: {{ $root.Values.web.secretRoot | quote }}
              readOnly: true
          {{- end }}
          resources:
            {{- toYaml (default $root.Values.resources $root.Values.web.resources) | nindent 12 }}
      volumes:
        - name: admin-bearer-secrets
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: {{ required "runtime.existingPaymentSecret is required" $root.Values.runtime.existingPaymentSecret }}
                  optional: true
                  items:
                    - key: payment-admin.token
                      path: payment-admin.token
                      mode: 0440
              - secret:
                  name: {{ required "runtime.existingGatewaySecret is required" $root.Values.runtime.existingGatewaySecret }}
                  optional: true
                  items:
                    - key: gateway-admin.token
                      path: gateway-admin.token
                      mode: 0440
      {{- if $root.Values.web.artifactPvc }}
        - name: subplatform-artifacts
          persistentVolumeClaim:
            claimName: {{ $root.Values.web.artifactPvc | quote }}
      {{- end }}
      {{- if $root.Values.web.uploadPvc }}
        - name: subplatform-uploads
          persistentVolumeClaim:
            claimName: {{ $root.Values.web.uploadPvc | quote }}
      {{- end }}
      {{- if $root.Values.web.secretPvc }}
        - name: subplatform-email-secrets
          persistentVolumeClaim:
            claimName: {{ $root.Values.web.secretPvc | quote }}
      {{- end }}

{{- if $root.Values.subplatformBuilder.enabled }}
{{- if and (eq $root.Values.runtime.environment "production") (or (not $root.Values.subplatformBuilder.uploadPvc) (not $root.Values.subplatformBuilder.artifactPvc)) }}
{{- fail "subplatformBuilder.uploadPvc and subplatformBuilder.artifactPvc are required in production" }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "matchplane.fullname" $root }}-subplatform-builder
  labels:
    {{- include "matchplane.labels" $root | nindent 4 }}
    app.kubernetes.io/component: subplatform-builder
spec:
  replicas: {{ $root.Values.subplatformBuilder.replicas }}
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      {{- include "matchplane.selectorLabels" $root | nindent 6 }}
      app.kubernetes.io/component: subplatform-builder
  template:
    metadata:
      labels:
        {{- include "matchplane.selectorLabels" $root | nindent 8 }}
        app.kubernetes.io/component: subplatform-builder
    spec:
      serviceAccountName: {{ include "matchplane.fullname" $root }}
      automountServiceAccountToken: false
      securityContext:
        {{- toYaml $root.Values.podSecurityContext | nindent 8 }}
      terminationGracePeriodSeconds: 30
      containers:
        - name: subplatform-builder
          image: {{ include "matchplane.builderImage" $root }}
          imagePullPolicy: {{ $root.Values.image.pullPolicy }}
          env:
            - name: MATCHPLANE_SUBPLATFORM_BUILDER_WEB_URL
              value: {{ default (printf "http://%s-web:%v" (include "matchplane.fullname" $root) $root.Values.web.service.port) $root.Values.subplatformBuilder.webUrl | quote }}
            - name: MATCHPLANE_SUBPLATFORM_BUILDER_TOKEN_FILE
              value: {{ $root.Values.subplatformBuilder.tokenFile | quote }}
            - name: MATCHPLANE_SUBPLATFORM_UPLOAD_ROOT
              value: {{ $root.Values.subplatformBuilder.uploadRoot | quote }}
            - name: MATCHPLANE_SUBPLATFORM_ARTIFACT_ROOT
              value: {{ $root.Values.subplatformBuilder.artifactRoot | quote }}
            - name: MATCHPLANE_SUBPLATFORM_BUILDER_WORK_ROOT
              value: {{ $root.Values.subplatformBuilder.workRoot | quote }}
            - name: MATCHPLANE_SUBPLATFORM_BUILDER_POLL_SECONDS
              value: {{ $root.Values.subplatformBuilder.pollSeconds | quote }}
            - name: MATCHPLANE_SUBPLATFORM_BUILDER_BUILD_SECONDS
              value: {{ $root.Values.subplatformBuilder.buildSeconds | quote }}
            - name: MATCHPLANE_SUBPLATFORM_GIT_ALLOWED_HOSTS
              value: {{ $root.Values.subplatformBuilder.gitAllowedHosts | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: builder-token
              mountPath: /run/secrets
              readOnly: true
            - name: builder-work
              mountPath: {{ $root.Values.subplatformBuilder.workRoot | quote }}
            - name: subplatform-uploads
              mountPath: {{ $root.Values.subplatformBuilder.uploadRoot | quote }}
              readOnly: true
            - name: subplatform-artifacts
              mountPath: {{ $root.Values.subplatformBuilder.artifactRoot | quote }}
            - name: builder-tmp
              mountPath: /tmp
          resources:
            {{- toYaml (default $root.Values.resources $root.Values.subplatformBuilder.resources) | nindent 12 }}
      volumes:
        - name: builder-token
          secret:
            secretName: {{ required "runtime.existingWebSecret is required" $root.Values.runtime.existingWebSecret }}
            defaultMode: 0440
            items:
              - key: subplatform-builder-token
                path: subplatform-builder.token
        - name: builder-work
          emptyDir: {}
        - name: builder-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 256Mi
        - name: subplatform-uploads
          {{- if $root.Values.subplatformBuilder.uploadPvc }}
          persistentVolumeClaim:
            claimName: {{ $root.Values.subplatformBuilder.uploadPvc | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: subplatform-artifacts
          {{- if $root.Values.subplatformBuilder.artifactPvc }}
          persistentVolumeClaim:
            claimName: {{ $root.Values.subplatformBuilder.artifactPvc | quote }}
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
