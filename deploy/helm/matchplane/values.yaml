image:
  repository: ghcr.io/lightjunction/matchplane
  # Retained for release metadata; deployments use the immutable digest below.
  tag: 0.1.9
  # Intentionally empty: production renders must provide the published image digest.
  digest: ''
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ''
fullnameOverride: ''

networkPolicy:
  # Fail closed for pod egress. Add private database/broker CIDRs or selectors below when those
  # dependencies live outside this namespace.
  enabled: true
  # Provider adapters require HTTPS. Private, link-local, and reserved ranges are excluded.
  allowPublicHttps: true
  additionalEgress: []

runtime:
  # This secret must provide database-url and valkey-url keys.
  existingSecret: matchplane-runtime
  # These secrets are split so the public gateway cannot read payment credentials or invoice keys.
  existingGatewaySecret: matchplane-gateway-secrets
  existingPaymentSecret: matchplane-payment-secrets
  # This secret must provide server.crt, server.key, and client-ca.crt keys.
  existingTlsSecret: matchplane-federation-tls
  # This secret must provide ca.crt, client.crt, and client.key for Kafka mTLS.
  existingKafkaTlsSecret: matchplane-kafka-tls
  environment: production
  # Override with a unique UUID per federation node before a production install.
  nodeId: ''
  kafkaBrokers: matchplane-kafka-bootstrap:9093
  kafkaSecurityProtocol: SSL
  kafkaSslCaLocation: /run/matchplane/kafka/ca.crt
  kafkaSslCertificateLocation: /run/matchplane/kafka/client.crt
  kafkaSslKeyLocation: /run/matchplane/kafka/client.key
  logFilter: info,matchplane=info
  otlpEndpoint: https://otel-collector:4317
  requireTls: true
  tlsCertificatePath: /run/matchplane/tls/server.crt
  tlsPrivateKeyPath: /run/matchplane/tls/server.key
  tlsClientCaPath: /run/matchplane/tls/client-ca.crt
  contactDataKeyPath: /run/secrets/contact-data.key
  contactDataKeyVersion: 1
  invoiceDataKeyPath: /run/secrets/invoice-data.key
  invoiceDataKeyVersion: 1
  paymentAdminTokenPath: /run/secrets/payment-admin.token
  gatewayAdminTokenPath: /run/secrets/gateway-admin.token
  paymentCallbackOrigin: https://payments.example.com

gateway:
  replicas: 2
  service:
    type: ClusterIP
    port: 8080

paymentService:
  replicas: 2
  service:
    type: ClusterIP
    port: 8080

matcher:
  replicas: 1

federationHub:
  replicas: 2
  service:
    type: ClusterIP
    port: 50051

workers:
  eventRelayReplicas: 2
  projectorReplicas: 2
  vectorWorkerReplicas: 2

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: '2'
    memory: 1Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 12001
  runAsGroup: 12001
  fsGroup: 12001
  seccompProfile:
    type: RuntimeDefault

nodeSelector: {}
tolerations: []
affinity: {}
