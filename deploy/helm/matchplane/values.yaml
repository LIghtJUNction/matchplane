image:
  repository: ghcr.io/lightjunction/matchplane
  # Retained for release metadata; deployments use the immutable digest below.
  tag: 0.1.10
  # Intentionally empty: production renders must provide the published image digest.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

web:
  # Exactly one writer is required until the router lock is safe across Pod/PID namespaces.
  replicas: 1
  image:
    repository: ghcr.io/lightjunction/matchplane-web
    # Production renders must provide the immutable digest published by CI.
    digest: ""
  service:
    type: ClusterIP
    port: 4173
  # This secret must provide better-auth-secret and root-admin-email; it may also provide
  # root-smtp-credential-ref. The payment-admin.token/gateway-admin.token keys are projected
  # separately from the payment/gateway secrets into the web BFF.
  existingSecret: matchplane-web-secrets
  # Required per deployment; keep domains out of the reusable chart defaults.
  betterAuthUrl: ""
  trustedOrigins: ""
  rootTenantId: ""
  rootOrganizationId: ""
  artifactRoot: /var/lib/matchplane/subplatform-artifacts
  # Optional read-only PVC containing artifacts produced by the isolated plugin builder.
  # Leave empty when artifacts are supplied by the host-mounted systemd/Compose path.
  artifactPvc: ""
  uploadRoot: /var/lib/matchplane/subplatform-uploads
  mediaMaxBytes: 26214400
  hostedMediaRoot: /var/lib/matchplane/media
  # ReadWriteMany is required when web.replicas is greater than one.
  hostedMediaPvc: ""
  # Optional ReadWriteMany PVC for opaque archive uploads. The isolated builder should mount
  # the same PVC read-only or consume the upload object through an external worker.
  uploadPvc: ""
  secretRoot: /run/matchplane/subplatform-email-secrets
  # Optional read-only PVC populated by the deployment secret manager. Its layout is
  # <tenant-uuid>/<domain-uuid>/<slot-name> and is never writable by the web pod.
  secretPvc: ""
  # Durable state for Web-managed router generations, audit delivery, and credential slots.
  # This storage is mandatory because an ephemeral Web filesystem can silently lose an activated
  # router during a restart. Production must name an existing claim or an explicit storage class.
  platformRouterStorage:
    enabled: true
    existingClaim: ""
    storageClass: ""
    size: 1Gi
    accessModes:
      - ReadWriteOnce
  # The router provider is optional. Keep its API key in existingWebSecret under router-ai-key.
  routerAiUrl: ""
  routerAiModel: ""
  routerAiProtocol: openai-compatible
  routerAiMaxTokens: 512
  routerAiToolMode: auto
  routerAiMaxSteps: 8
  routerAiRequestsPerHour: 120
  # Optional approved national network identity adapter. The client secret is
  # read from existingWebSecret under national-identity-client-secret.
  nationalIdentity:
    clientId: ""
    discoveryUrl: ""
    authorizationUrl: ""
    tokenUrl: ""
    userInfoUrl: ""
    scopes: openid
  # Root SMTP is needed only for first-run/admin auth. The credential itself stays in the
  # existing web secret under root-smtp-credential-ref (file:// or env:// reference).
  rootSmtp:
    providerKey: root-smtp
    host: ""
    port: 587
    tlsMode: starttls
    username: ""
    fromAddress: ""
    replyTo: ""
    mode: production
    enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 512Mi

subplatformBuilder:
  enabled: true
  replicas: 1
  image:
    repository: ghcr.io/lightjunction/matchplane-subplatform-builder
    # Production renders must provide the immutable builder image digest.
    digest: ""
  # Empty derives the release-local web service name in the Deployment template.
  webUrl: ""
  uploadRoot: /var/lib/matchplane/subplatform-uploads
  artifactRoot: /var/lib/matchplane/subplatform-artifacts
  workRoot: /var/lib/matchplane/subplatform-builder-work
  uploadPvc: ""
  artifactPvc: ""
  pollSeconds: 5
  buildSeconds: 900
  gitAllowedHosts: github.com,gitlab.com
  tokenFile: /run/secrets/subplatform-builder.token
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "2"
      memory: 1Gi

networkPolicy:
  # Fail closed for pod egress. Add private database/broker CIDRs or selectors below when those
  # dependencies live outside this namespace.
  enabled: true
  # Provider adapters require HTTPS. Private, link-local, and reserved ranges are excluded.
  allowPublicHttps: true
  additionalEgress: []

runtime:
  # Legacy shared secret retained only for development/test renders. Production
  # requires a distinct secret for every workload below.
  existingSecret: matchplane-runtime
  # Each secret must provide database-url. Cache-using workloads must also provide valkey-url;
  # the database-only conversion projector must not receive it. Use distinct PostgreSQL roles
  # and Valkey ACL users; do not reuse the migration identity.
  serviceSecrets:
    web: ""
    gateway: ""
    payment-service: ""
    event-relay: ""
    conversion-projector: ""
    matcher: ""
    projector: ""
    vector-worker: ""
    federation-hub: ""
    migration: ""
  # These secrets are split so the public gateway cannot read payment credentials or invoice keys.
  existingGatewaySecret: matchplane-gateway-secrets
  existingPaymentSecret: matchplane-payment-secrets
  existingWebSecret: matchplane-web-secrets
  # This secret must provide server.crt, server.key, and client-ca.crt keys.
  existingTlsSecret: matchplane-federation-tls
  # This secret must provide ca.crt, client.crt, and client.key for Kafka mTLS.
  existingKafkaTlsSecret: matchplane-kafka-tls
  # Production requires a distinct Kafka mTLS identity per client workload.
  kafkaTlsSecrets:
    event-relay: ""
    matcher: ""
    projector: ""
  environment: production
  # Override with a unique UUID per federation node before a production install.
  nodeId: ""
  kafkaBrokers: matchplane-kafka-bootstrap:9093
  kafkaSecurityProtocol: SSL
  kafkaSslCaLocation: /run/matchplane/kafka/ca.crt
  kafkaSslCertificateLocation: /run/matchplane/kafka/client.crt
  kafkaSslKeyLocation: /run/matchplane/kafka/client.key
  logFilter: info,matchplane=info
  otlpEndpoint: https://otel-collector:4317
  requireTls: true
  tlsCertificatePath: /run/matchplane/tls/server.crt
  tlsPrivateKeyPath: /run/matchplane/tls/server.key
  tlsClientCaPath: /run/matchplane/tls/client-ca.crt
  contactDataKeyPath: /run/secrets/contact-data.key
  contactDataKeyVersion: 1
  invoiceDataKeyPath: /run/secrets/invoice-data.key
  invoiceDataKeyVersion: 1
  paymentAdminTokenPath: /run/secrets/payment-admin.token
  gatewayAdminTokenPath: /run/secrets/gateway-admin.token
  # Required operator input; an empty value intentionally fails production config validation.
  paymentCallbackOrigin: ""

gateway:
  replicas: 2
  service:
    type: ClusterIP
    port: 8080

paymentService:
  replicas: 2
  service:
    type: ClusterIP
    port: 8080

matcher:
  replicas: 1

federationHub:
  replicas: 2
  service:
    type: ClusterIP
    port: 50051

conversionProjector:
  # The chart ships the workload declaration disabled. Production must opt in explicitly only
  # after the database migration, service-scoped secret, and operator runbook are ready.
  enabled: false
  replicas: 2
  batchSize: 1
  pollMs: 1000
  poolSize: 5
  degradedAfterSeconds: 300
  service:
    type: ClusterIP
    port: 8080

workers:
  eventRelayReplicas: 2
  projectorReplicas: 2
  vectorWorkerReplicas: 2

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "2"
    memory: 1Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 12001
  runAsGroup: 12001
  fsGroup: 12001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

nodeSelector: {}
tolerations: []
affinity: {}
