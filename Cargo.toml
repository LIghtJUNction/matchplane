[workspace]
members = [
  "crates/matchplane-application",
  "crates/matchplane-cache",
  "crates/matchplane-config",
  "crates/matchplane-domain",
  "crates/matchplane-engine",
  "crates/matchplane-matching",
  "crates/matchplane-events",
  "crates/matchplane-agent-runtime",
  "crates/matchplane-http",
  "crates/matchplane-oauth-bridge",
  "crates/matchplane-observability",
  "crates/matchplane-payments",
  "crates/matchplane-protocol",
  "crates/matchplane-storage",
  "services/matchplane-conversion-projector",
  "services/matchplane-event-relay",
  "services/matchplane-federation-hub",
  "services/matchplane-gateway",
  "services/matchplane-matcher",
  "services/matchplane-payment-service",
  "services/matchplane-projector",
  "services/matchplane-subplatform-builder",
  "services/matchplane-vector-worker",
  "tools/xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.10"
edition = "2024"
rust-version = "1.97"
license = "MIT"
publish = false

[workspace.dependencies]
anyhow = "1.0.104"
aes-gcm = "0.11.0"
async-trait = "0.1.92"
axum = "0.8.9"
base64 = "0.23.1"
bigdecimal = { version = "0.4.10", features = ["serde"] }
bytes = "1.12.1"
clap = { version = "4.6.6", features = ["derive", "env"] }
config = "0.15.25"
futures-util = "0.3.34"
flate2 = "1.1.1"
fred = { version = "10.1.0", features = ["enable-rustls-ring", "i-scripts"] }
getrandom = "0.3.4"
hex = "0.4.3"
metrics = "0.24.6"
metrics-exporter-prometheus = { version = "0.18.3", default-features = false }
md-5 = "0.11.0"
opentelemetry = { version = "0.32.0", features = ["trace"] }
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["grpc-tonic", "tls-ring", "tls-roots", "trace"] }
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio", "trace"] }
oauth2 = { version = "5.0.0", default-features = false, features = ["reqwest", "rustls-tls"] }
percent-encoding = "2.3.1"
prost = "0.14.4"
prost-types = "0.14.4"
rdkafka = { version = "0.39.0", features = ["cmake-build", "ssl-vendored", "tracing"] }
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "rustls", "stream"] }
rustls = { version = "0.23.43", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2.2.0"
rustix = { version = "1.1.4", features = ["process"] }
rig-core = { version = "0.42.0", default-features = false }
rpassword = "7.5.4"
rsa = { version = "0.9.10", features = ["sha2"] }
scrypt = "0.11.0"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
signature = "2.2.0"
subtle = "2.6.1"
sqlx = { version = "0.9.0", default-features = false, features = ["bigdecimal", "derive", "json", "macros", "migrate", "postgres", "runtime-tokio", "time", "tls-rustls-ring-webpki", "uuid"] }
thiserror = "2.0.20"
tar = "0.4.45"
time = { version = "0.3.55", features = ["formatting", "parsing", "serde", "serde-human-readable"] }
tokio = { version = "1.53.1", features = ["io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tonic = { version = "0.14.6", features = ["tls-ring"] }
tonic-prost = "0.14.6"
tonic-prost-build = "0.14.6"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.0", features = ["catch-panic", "compression-gzip", "cors", "limit", "request-id", "timeout", "trace"] }
tracing = "0.1.44"
tracing-opentelemetry = "0.33.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
uuid = { version = "1.24.0", features = ["serde", "v5", "v7"] }
unicode-normalization = "0.1.25"
walkdir = "2.5.0"
zstd = "0.13.2"
url = "2.5.8"

matchplane-cache = { path = "crates/matchplane-cache" }
matchplane-application = { path = "crates/matchplane-application" }
matchplane-config = { path = "crates/matchplane-config" }
matchplane-domain = { path = "crates/matchplane-domain" }
matchplane-engine = { path = "crates/matchplane-engine" }
matchplane-matching = { path = "crates/matchplane-matching", version = "0.1.1" }
matchplane-events = { path = "crates/matchplane-events" }
matchplane-http = { path = "crates/matchplane-http" }
matchplane-observability = { path = "crates/matchplane-observability" }
matchplane-payments = { path = "crates/matchplane-payments" }
matchplane-protocol = { path = "crates/matchplane-protocol" }
matchplane-storage = { path = "crates/matchplane-storage" }

[workspace.lints.rust]
future_incompatible = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
nonstandard_style = { level = "deny", priority = -1 }
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "deny"
redundant_clone = "warn"
todo = "deny"
unimplemented = "deny"
