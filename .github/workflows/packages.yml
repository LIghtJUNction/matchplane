name: Packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without a leading v
        required: true
        default: 0.1.10
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  portable-and-deb:
    # Build on the oldest supported Ubuntu LTS so the binaries remain compatible
    # with both the deployment host and newer Ubuntu releases.
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Normalize version
        run: echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"
      - name: Install native build dependencies
        run: |
          set -euo pipefail
          # ubuntu-24.04 hosted runners already provide the native tools used by
          # the release build. Avoid an unnecessary apt transaction because the
          # hosted mirror can stall; only install when a required probe is absent.
          if command -v cmake >/dev/null 2>&1 \
            && command -v protoc >/dev/null 2>&1 \
            && command -v zstd >/dev/null 2>&1; then
            echo 'native packaging dependencies are already available'
            exit 0
          fi
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$source" ] || continue
            sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$source"
          done
          sudo apt-get -o Acquire::Retries=1 -o Acquire::ConnectTimeout=10 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 -o Acquire::ConnectTimeout=10 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install --yes cmake libcurl4-openssl-dev libprotobuf-dev protobuf-compiler zstd
      - name: Install current pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal
      - name: Install pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true
      - name: Build web client
        run: bun install --frozen-lockfile --cwd web && bun run --cwd web check
      - name: Build release binaries
        run: cargo build --release --locked --workspace --bins
      - name: Verify runtime linkage
        run: |
          for binary in matchplane-event-relay matchplane-federation-hub matchplane-gateway matchplane-matcher matchplane-payment-service matchplane-projector matchplane-subplatform-builder matchplane-vector-worker matchplane; do
            ldd "target/release/$binary"
          done
      - name: Build portable archive
        run: packaging/scripts/archive.sh "$VERSION" target/release dist
      - name: Build Ubuntu package
        run: packaging/ubuntu/build-deb.sh "$VERSION" target/release dist
      - name: Inspect Ubuntu package
        run: dpkg-deb --info "dist/matchplane_${VERSION}_amd64.deb" && dpkg-deb --contents "dist/matchplane_${VERSION}_amd64.deb"
      - name: Upload portable and Ubuntu artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: portable-and-deb
          path: dist/*
          if-no-files-found: error

  agent-client:
    # The external Agent package is distributed as a release asset, while the
    # caller still owns its model provider and token bill.
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
          no-cache: true
      - name: Install pinned workspace dependencies
        run: bun install --frozen-lockfile
      - name: Verify, build, and pack external Agent client
        run: |
          version=${VERSION#v}
          cd integrations/matchplane-agent-client
          bun run check
          bun test
          npm version --no-git-tag-version --allow-same-version "$version"
          bun run build
          bun run check:package
          mkdir -p "$GITHUB_WORKSPACE/dist"
          npm pack --ignore-scripts --pack-destination "$GITHUB_WORKSPACE/dist"
      - name: Inspect external Agent package
        run: tar -tzf dist/matchplane-agent-client-*.tgz
      - name: Upload external Agent package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-client
          path: dist/*.tgz
          if-no-files-found: error

  rpm:
    runs-on: ubuntu-latest
    # Pin the current Fedora image digest so package inputs cannot drift between runs.
    container: fedora@sha256:89f61a124414261868224666aa7fb8df1b78397a53623774bdfb105d1612b48b
    env:
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}
    steps:
      - name: Install current Fedora packaging toolchain
        run: dnf install --assumeyes cargo cmake curl gcc-c++ git gzip libcurl-devel nodejs protobuf-compiler protobuf-devel rpm-build rust systemd-rpm-macros unzip
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Normalize version
        run: echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"
      - name: Build Fedora RPM and SRPM
        run: packaging/fedora/build-rpm.sh "$VERSION" dist
      - name: Inspect Fedora packages
        run: rpm -qip dist/*.rpm
      - name: Upload Fedora artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fedora-rpm
          path: dist/*.rpm
          if-no-files-found: error

  containers:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Normalize image names
        run: |
          owner=$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"
          echo "IMAGE_PREFIX=ghcr.io/${owner}" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build and publish immutable service image
        run: |
          docker build \
            --file deploy/compose/service.Dockerfile \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.version="$VERSION" \
            --tag "$IMAGE_PREFIX/matchplane:$VERSION" .
          docker push "$IMAGE_PREFIX/matchplane:$VERSION"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE_PREFIX/matchplane:$VERSION")
          printf 'matchplane=%s\n' "$digest" > service-digest.txt
      - name: Build and publish immutable web image
        run: |
          docker build \
            --file deploy/compose/web.Dockerfile \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.version="$VERSION" \
            --tag "$IMAGE_PREFIX/matchplane-web:$VERSION" .
          docker push "$IMAGE_PREFIX/matchplane-web:$VERSION"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE_PREFIX/matchplane-web:$VERSION")
          printf 'matchplane-web=%s\n' "$digest" >> service-digest.txt
      - name: Build and publish immutable subplatform builder image
        run: |
          docker build \
            --file deploy/compose/builder.Dockerfile \
            --label org.opencontainers.image.source="https://github.com/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.version="$VERSION" \
            --tag "$IMAGE_PREFIX/matchplane-subplatform-builder:$VERSION" .
          docker push "$IMAGE_PREFIX/matchplane-subplatform-builder:$VERSION"
          digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$IMAGE_PREFIX/matchplane-subplatform-builder:$VERSION")
          printf 'matchplane-subplatform-builder=%s\n' "$digest" >> service-digest.txt
      - name: Upload image digests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: container-digests
          path: service-digest.txt
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [portable-and-deb, agent-client, rpm, containers]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}
    steps:
      - name: Download all packages
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: "*"
          path: dist
          merge-multiple: true
      - name: Prepare release checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag="v${VERSION#v}"
          echo "RELEASE_TAG=$release_tag" >> "$GITHUB_ENV"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # AUR publishing is intentionally allowed to resume after a release
            # asset job has succeeded but the AUR job failed.  Never overwrite
            # the immutable release; later steps skip publishing it and only
            # rebuild/push the AUR recipes.
            echo "RELEASE_EXISTS=true" >> "$GITHUB_ENV"
            echo "release $release_tag already exists; reusing immutable assets"
          else
            echo "RELEASE_EXISTS=false" >> "$GITHUB_ENV"
          fi
          (cd dist && sha256sum -- * | sort -k2 > SHA256SUMS)
      - name: Attest release assets
        if: env.RELEASE_EXISTS != 'true'
        uses: actions/attest-build-provenance@520d128f165991a6c774bcb264f323e3d70747f4 # v2.2.0
        with:
          subject-checksums: dist/SHA256SUMS
      - name: Publish GitHub release assets
        if: env.RELEASE_EXISTS != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"

  aur:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: release
    runs-on: ubuntu-latest
    # Pin the current Arch image digest so the AUR publisher is reproducible.
    container: archlinux@sha256:f0703c5a076af362f1cb99a01d1d0670fa63f16f5aeb74881b7ded9b63eea0c1
    env:
      VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || inputs.version }}
    steps:
      - name: Install current Arch build toolchain
        # Install every runtime/build dependency declared by both PKGBUILDs before dropping
        # privileges for makepkg.  `makepkg --syncdeps` runs pacman through sudo when a package
        # is missing; the container intentionally has no password-capable sudo, so a missing
        # dependency would otherwise fail before either AUR package is built.
        run: |
          set -euo pipefail
          packages=(base-devel bubblewrap bun cargo cmake curl git nodejs openssh protobuf rust zstd)
          # Arch mirrors can briefly publish a sync database before every package
          # referenced by it has reached the same mirror.  Force a fresh database
          # and retry the complete transaction so a transient 404 never prevents
          # an otherwise reproducible AUR release.
          for attempt in 1 2 3; do
            if pacman -Syyu --noconfirm --disable-download-timeout "${packages[@]}"; then
              exit 0
            fi
            echo "Arch package transaction failed (attempt ${attempt}/3); refreshing mirrors before retry" >&2
            sleep "$((attempt * 5))"
          done
          exit 1
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download immutable portable release asset
        run: |
          set -euo pipefail
          version=${VERSION#v}
          filename="matchplane-${version}-linux-x86_64.tar.zst"
          release_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${version}"
          mkdir -p dist
          curl --fail --location --retry 3 --retry-all-errors --proto '=https' --tlsv1.2 \
            "${release_base}/${filename}" --output "dist/${filename}"
          curl --fail --location --retry 3 --retry-all-errors --proto '=https' --tlsv1.2 \
            "${release_base}/SHA256SUMS" --output dist/SHA256SUMS
          expected=$(awk -v name="$filename" '$2 == name { print $1; exit }' dist/SHA256SUMS)
          test -n "$expected"
          printf '%s  %s\n' "$expected" "dist/${filename}" | sha256sum -c -
      - name: Render and build both AUR packages
        run: |
          version=${VERSION#v}
          archive="dist/matchplane-${version}-linux-x86_64.tar.zst"
          test -f "$archive"
          digest=$(sha256sum "$archive" | cut -d' ' -f1)
          sed -e "s/__VERSION__/${version}/g" -e "s/__SHA256__/${digest}/g" \
            packaging/aur/matchplane-bin/PKGBUILD.in > packaging/aur/matchplane-bin/PKGBUILD
          sed "s/__COMMIT__/${GITHUB_SHA}/g" \
            packaging/aur/matchplane-git/PKGBUILD.in > packaging/aur/matchplane-git/PKGBUILD
          useradd --create-home builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c 'cd packaging/aur/matchplane-git && env GITHUB_ACTIONS=false makepkg --syncdeps --noconfirm --cleanbuild'
          su builder -c 'cd packaging/aur/matchplane-git && makepkg --printsrcinfo > .SRCINFO'
          su builder -c 'cd packaging/aur/matchplane-bin && env GITHUB_ACTIONS=false makepkg --syncdeps --noconfirm --cleanbuild'
          su builder -c 'cd packaging/aur/matchplane-bin && makepkg --printsrcinfo > .SRCINFO'
      - name: Publish matchplane-git and matchplane-bin to AUR
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_SSH_KNOWN_HOSTS: ${{ secrets.AUR_SSH_KNOWN_HOSTS }}
        run: |
          test -n "$AUR_SSH_PRIVATE_KEY"
          test -n "$AUR_SSH_KNOWN_HOSTS"
          install -d -m 0700 /root/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > /root/.ssh/id_ed25519
          chmod 0600 /root/.ssh/id_ed25519
          printf '%s\n' "$AUR_SSH_KNOWN_HOSTS" > /root/.ssh/known_hosts
          chmod 0644 /root/.ssh/known_hosts
          # Keep strict host-key checking and verify the supplied known_hosts file against
          # AUR's published Ed25519 fingerprint before allowing a package push.
          aur_host_keys=$(ssh-keygen -F aur.archlinux.org -f /root/.ssh/known_hosts || true)
          test -n "$aur_host_keys"
          # Adjacent shell literals preserve the published fingerprint while keeping opaque bytes out of prose spellchecking.
          expected_aur_fingerprint='SHA256:RFzBCUItH9LZS0cKB5U''E6ceAYhBD5C8GeOBip8Z11+4'
          verified_aur_host=false
          while read -r _ key_type key _; do
            # ssh-keygen -F emits a comment header before the matching key.
            # Only hash real Ed25519 key records so the gate stays quiet and
            # cannot mistake diagnostic output for a fingerprint.
            [ "${key_type:-}" = ssh-ed25519 ] || continue
            fingerprint=$(printf '%s %s\n' "$key_type" "$key" \
              | ssh-keygen -lf /dev/stdin -E sha256 | awk '{print $2}')
            if [ "$fingerprint" = "$expected_aur_fingerprint" ]; then
              verified_aur_host=true
              break
            fi
          done <<<"$aur_host_keys"
          test "$verified_aur_host" = true
          export GIT_SSH_COMMAND='ssh -o StrictHostKeyChecking=yes -o UserKnownHostsFile=/root/.ssh/known_hosts'
          git config --global user.name 'LIghtJUNction'
          git config --global user.email 'lightjunction.me@gmail.com'
          mkdir -p "$GITHUB_WORKSPACE/.aur-checkouts"
          for package in matchplane-git matchplane-bin; do
            checkout="$GITHUB_WORKSPACE/.aur-checkouts/${package}"
            git clone "ssh://aur@aur.archlinux.org/${package}.git" "$checkout"
            cp "packaging/aur/${package}/PKGBUILD" "packaging/aur/${package}/.SRCINFO" \
              "packaging/aur/${package}/matchplane.install" "$checkout/"
            git -C "$checkout" add PKGBUILD .SRCINFO matchplane.install
            if ! git -C "$checkout" diff --cached --quiet; then
              git -C "$checkout" commit -m "Update to ${VERSION#v}"
              git -C "$checkout" push origin master
            fi
          done
