name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install locked JavaScript workspaces
        run: bun install --frozen-lockfile
      # The web workspace keeps its own lockfile so it can also be built from
      # `web/` in isolation. Install that workspace explicitly; a root install
      # alone does not guarantee that Next is linked into web/node_modules.
      - name: Install locked web workspace
        run: bun install --frozen-lockfile --cwd web
      - name: Test and build JavaScript workspaces
        run: bun run check
      - name: Test external Agent client
        run: bun test --cwd integrations/matchplane-agent-client
      - name: Type-check external Agent client
        run: web/node_modules/.bin/tsc -p integrations/matchplane-agent-client/tsconfig.json --noEmit

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Install native build dependencies
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
          sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install --yes cmake libcurl4-openssl-dev libprotobuf-dev protobuf-compiler
      - name: Install current pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --component clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Validate Compose model
        run: docker compose --env-file .env.example -f deploy/compose/compose.yaml config --quiet

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - name: Run complete Compose smoke test
        run: ./tests/integration/compose-smoke.sh
      - name: Collect service logs
        if: always()
        run: docker compose --env-file .env.example -f deploy/compose/compose.yaml logs --no-color > compose.log
      - name: Upload integration log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compose-log
          path: compose.log
          if-no-files-found: ignore
      - name: Stop integration stack
        if: always()
        run: docker compose --env-file .env.example -f deploy/compose/compose.yaml down --volumes
