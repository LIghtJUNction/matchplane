name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install pinned Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Install locked JavaScript workspaces
        run: bun install --frozen-lockfile
      # The web workspace keeps its own lockfile so it can also be built from
      # `web/` in isolation. Install that workspace explicitly; a root install
      # alone does not guarantee that Next is linked into web/node_modules.
      - name: Install locked web workspace
        run: bun install --frozen-lockfile --cwd web
      - name: Test and build JavaScript workspaces
        run: bun run check
      - name: Test external Agent client
        run: bun test --cwd integrations/matchplane-agent-client
      - name: Type-check external Agent client
        run: web/node_modules/.bin/tsc -p integrations/matchplane-agent-client/tsconfig.json --noEmit

  subplatform:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install current Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14
      - name: Build subplatform UI and run child Agent tests
        run: |
          bun install --no-save --cwd subplatforms/auto
          bun run --cwd subplatforms/auto build
          test -s subplatforms/auto/dist/index.html
          bun run --cwd subplatforms/auto agent:test

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready --username postgres --dbname postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      valkey:
        image: valkey/valkey:9.1.1-alpine@sha256:ee91f7a174ac4d6a6b0685b3a60e321f0a9dbbb691f9b0e285be2ba1d1be8328
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install native build dependencies
        run: |
          set -euo pipefail
          # ubuntu-latest already ships the native toolchain used by this
          # workspace. Avoid an unnecessary apt transaction: the hosted apt
          # mirror can occasionally stall for many minutes and the build does
          # not need the package manager when these probes are present.
          if command -v cmake >/dev/null 2>&1 \
            && command -v protoc >/dev/null 2>&1 \
            && pkg-config --exists libcurl; then
            echo 'cmake, protoc, and libcurl development metadata are already available'
            exit 0
          fi
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
            [ -f "$source" ] || continue
            sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$source"
          done
          # GitHub's Ubuntu image normally has package indexes ready. Try the
          # bounded install first so a slow mirror does not block every Rust
          # check; refresh indexes only when the cached metadata is insufficient.
          install_cmd=(sudo env DEBIAN_FRONTEND=noninteractive apt-get -o Acquire::Retries=1 -o Acquire::ConnectTimeout=10 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install --yes cmake libcurl4-openssl-dev libprotobuf-dev protobuf-compiler)
          if "${install_cmd[@]}"; then
            exit 0
          fi
          sudo apt-get -o Acquire::Retries=1 -o Acquire::ConnectTimeout=10 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
          "${install_cmd[@]}"
      - name: Install current pinned Rust toolchain
        run: rustup toolchain install 1.97.0 --profile minimal --component clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Test ordered outbox claims against PostgreSQL
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: cargo test --locked -p matchplane-storage --test outbox_claims -- --ignored
      - name: Test durable book recovery source against PostgreSQL
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: cargo test --locked -p matchplane-storage --test book_projection_recovery -- --ignored
      - name: Test Kafka poison-record quarantine against PostgreSQL
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: cargo test --locked -p matchplane-storage --test kafka_consumer_quarantine -- --ignored
      - name: Test atomic Valkey book repair
        env:
          MATCHPLANE_TEST_VALKEY_URL: redis://127.0.0.1:6379/
        run: cargo test --locked -p matchplane-cache durable_repair_should_seed_gap_and_fence_stale_writers -- --ignored
      - name: Validate Compose model
        run: docker compose --env-file .env.example -f deploy/compose/compose.yaml config --quiet

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: recursive
      - name: Run complete Compose smoke test
        run: ./tests/integration/compose-smoke.sh
      - name: Collect service logs
        if: always()
        run: docker compose --env-file .env.example -f deploy/compose/compose.yaml logs --no-color > compose.log
      - name: Upload integration log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compose-log
          path: compose.log
          if-no-files-found: ignore
      - name: Stop integration stack
        if: always()
        run: docker compose --env-file .env.example -f deploy/compose/compose.yaml down --volumes
