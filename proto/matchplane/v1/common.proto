syntax = "proto3";

package matchplane.v1;

import "google/protobuf/timestamp.proto";

enum StreamKind {
  STREAM_KIND_UNSPECIFIED = 0;
  STREAM_KIND_COMMAND = 1;
  STREAM_KIND_DOMAIN_EVENT = 2;
  STREAM_KIND_ORDER_BOOK_DELTA = 3;
  STREAM_KIND_MARKET_SUMMARY = 4;
  STREAM_KIND_FEDERATION = 5;
  STREAM_KIND_NODE_HEALTH = 6;
}

message EventEnvelope {
  string event_id = 1;
  string correlation_id = 2;
  string causation_id = 3;
  string source_node_id = 4;
  string tenant_id = 5;
  string domain_id = 6;
  string market_id = 7;
  string shard_id = 8;
  uint64 shard_sequence = 9;
  uint32 schema_version = 10;
  google.protobuf.Timestamp occurred_at = 11;
  bytes payload_hash = 12;
  StreamKind stream_kind = 13;
  string message_type = 14;
  bytes payload = 15;
  string traceparent = 16;
}
